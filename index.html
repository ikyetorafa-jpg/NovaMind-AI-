<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaMind AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f19;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            background: #111827;
        }

        header {
            padding: 18px;
            background: #151c2c;
            border-bottom: 1px solid #293244;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header p {
            margin: 5px 0 0;
            color: #9ca3af;
            font-size: 13px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
        }

        .user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 80%;
            padding: 12px 15px;
            border-radius: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user .bubble {
            background: #2563eb;
        }

        .bot .bubble {
            background: #1f2937;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: #151c2c;
            border-top: 1px solid #293244;
        }

        #message {
            flex: 1;
            padding: 14px;
            border: none;
            outline: none;
            border-radius: 10px;
            background: #202938;
            color: white;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <h1>NovaMind AI</h1>
        <p>Powered by Gemini AI</p>
    </header>

    <div id="chat">
        <div class="message bot">
            <div class="bubble">
                Hello! I'm NovaMind. How can I help you?
            </div>
        </div>
    </div>

    <div class="input-area">
        <input
            id="message"
            type="text"
            placeholder="Message NovaMind..."
            autocomplete="off"
        >

        <button id="send">Send</button>
    </div>

</div>

<script>
const input = document.getElementById("message");
const sendButton = document.getElementById("send");
const chat = document.getElementById("chat");

function addMessage(text, type) {
    const message = document.createElement("div");
    message.className = `message ${type}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);
    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
    const message = input.value.trim();

    if (!message) return;

    addMessage(message, "user");

    input.value = "";
    sendButton.disabled = true;

    addMessage("Thinking...", "bot");

    const thinkingMessage = chat.lastElementChild;

    try {
        const response = await fetch("/chat", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        thinkingMessage.remove();

        if (data.reply) {
            addMessage(data.reply, "bot");
        } else {
            addMessage(
                "Sorry, something went wrong.",
                "bot"
            );
        }

    } catch (error) {
        thinkingMessage.remove();

        addMessage(
            "Could not connect to the AI server.",
            "bot"
        );

        console.error(error);
    }

    sendButton.disabled = false;
    input.focus();
}

sendButton.addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
